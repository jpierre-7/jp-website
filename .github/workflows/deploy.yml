# Builds the Astro site and deploys it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows manual deploys from the Actions tab on GitHub
  workflow_dispatch:

# These permissions let the workflow publish to GitHub Pages via the API
permissions:
  contents: read
  pages: write
  id-token: write

# Prevents concurrent deployments — if a new push happens mid-deploy,
# the old deploy waits rather than racing.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm # caches node_modules between runs for faster builds

      - name: Install dependencies
        run: npm ci # ci = clean install; uses package-lock.json for reproducibility

      - name: Build
        run: npm run build # outputs static files to ./dist

      # Bundles ./dist into an artifact that the deploy job can access
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build # only runs if build succeeds
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
